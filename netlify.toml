# Netlify build + functions config

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty URLs for static folders (so /blog/ resolves to /blog/index.html)
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/calculators"
  to = "/calculators/index.html"
  status = 200

[[redirects]]
  from = "/analyze"
  to = "/analyze/index.html"
  status = 200

[[redirects]]
  from = "/str-outlook"
  to = "/str-outlook/index.html"
  status = 200

[[redirects]]
  from = "/market-data"
  to = "/market-data/index.html"
  status = 200

[[redirects]]
  from = "/quotes"
  to = "/quotes/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# Quote builder — added when we ported the cadence-crm quote builder into
# this site (see quotes/README.md). The borrower link
#   https://quotes.myunitedtrust.com/<token>
# transparently serves the borrower view from /quotes/q.html, even though it's
# this same Netlify deploy. Operators sign in at /quotes/ using pass codes
# stored in the cadence-crm Supabase (table: quote_operators).
# ─────────────────────────────────────────────────────────────────────────────

# Force www → apex for the quote builder. We have to do this at the HTML
# level (not just trust Netlify's default 308 on assets) because the
# Set-Cookie response on login gets scoped to whichever host the API
# response came from; mixing www visitor + apex API origin means the
# session cookie never makes it back to the browser. Status 301 + force
# applies before the catch-all asset redirects.
[[redirects]]
  from   = "https://www.myunitedtrust.com/quotes/*"
  to     = "https://myunitedtrust.com/quotes/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.myunitedtrust.com/api/*"
  to     = "https://myunitedtrust.com/api/:splat"
  status = 301
  force  = true

# Subdomain rewrites: quotes.myunitedtrust.com/* → /quotes/* assets, with the
# token URL collapsing to q.html for prettiness.
[[redirects]]
  from = "https://quotes.myunitedtrust.com/"
  to   = "/quotes/index.html"
  status = 200

[[redirects]]
  from = "https://quotes.myunitedtrust.com/:token"
  to   = "/quotes/q.html?t=:token"
  status = 200

[[redirects]]
  from = "https://quotes.myunitedtrust.com/*"
  to   = "/:splat"
  status = 200

# Friendlier API paths for the operator + borrower JS so they don't have to
# know about /.netlify/functions/...
[[redirects]]
  from = "/api/auth/login"
  to   = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to   = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to   = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/quotes/*"
  to   = "/.netlify/functions/quotes/:splat"
  status = 200

[[redirects]]
  from = "/api/public/quotes/*"
  to   = "/.netlify/functions/public-quotes/:splat"
  status = 200

# Operator UI shouldn't be cached — they want the latest builder on reload.
# Same treatment for the CSS/JS so a stuck browser cache can never serve
# a stale version while we iterate.
[[headers]]
  for = "/quotes/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/quotes/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/quotes/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
